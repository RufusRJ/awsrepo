<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Experiment 9</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #1e3c72, #2a5298);
            color: white;
            text-align: center;
        }

        .container {
            margin-top: 100px;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
            opacity: 0.9;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            margin: auto;
            width: 60%;
            border-radius: 12px;
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.3);
        }

        .footer {
            margin-top: 40px;
            font-size: 14px;
            opacity: 0.7;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <h1>DevOps Experiment 9</h1>
            <p>This page is deployed using AWS CodeBuild and Amazon S3.</p>
            <p>CI/CD pipeline successfully configured.</p>

            <div class="footer">
                <p>Created by Rufus Nicholas Ebenezer</p>
            </div>
        </div>
    </div>
</body>
</html>
